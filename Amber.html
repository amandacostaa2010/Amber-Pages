<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f2fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Amber Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="ambar">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="home" viewBox="0 0 24 24">
                <path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
            </symbol>
            <symbol id="search" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <path d="M20 20l-4-4" />
            </symbol>
            <symbol id="book" viewBox="0 0 24 24">
                <path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z" />
                <path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z" />
            </symbol>
            <symbol id="users" viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="3.5" />
                <path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6" />
                <circle cx="17" cy="9" r="2.5" />
                <path d="M17 14c3 0 5 2 5 5" />
            </symbol>
            <symbol id="user" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </symbol>
            <symbol id="plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
            </symbol>
            <symbol id="pencil" viewBox="0 0 24 24">
                <path d="M4 20l1-4L16 5l3 3L8 19z" />
            </symbol>
            <symbol id="grid" viewBox="0 0 24 24">
                <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
                <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
                <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
                <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
            </symbol>
            <symbol id="list" viewBox="0 0 24 24">
                <path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01" />
            </symbol>
            <symbol id="shelf" viewBox="0 0 24 24">
                <path d="M5 4v16M10 4v16M15 7l4-1 2 14-4 1z" />
            </symbol>
            <symbol id="star" viewBox="0 0 24 24">
                <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"
                    fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="share" viewBox="0 0 24 24">
                <path d="M12 3v12M8 7l4-4 4 4M5 12v7h14v-7" />
            </symbol>
            <symbol id="back" viewBox="0 0 24 24">
                <path d="M15 5l-7 7 7 7" />
            </symbol>
            <symbol id="close" viewBox="0 0 24 24">
                <path d="M6 6l12 12M18 6L6 18" />
            </symbol>
            <symbol id="palette" viewBox="0 0 24 24">
                <path
                    d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.5-2.2-.5-1.2.2-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z" />
                <path d="M7.5 11h.01M10 7.5h.01M14.5 7.5h.01" />
            </symbol>
            <symbol id="check" viewBox="0 0 24 24">
                <path d="M5 12l5 5 9-10" />
            </symbol>
            <symbol id="trash" viewBox="0 0 24 24">
                <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
            </symbol>
            <symbol id="camera" viewBox="0 0 24 24">
                <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
                <circle cx="12" cy="13" r="3.5" />
            </symbol>
            <symbol id="target" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="5" />
                <circle cx="12" cy="12" r="1" />
            </symbol>
            <symbol id="folder" viewBox="0 0 24 24">
                <path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </symbol>
            <symbol id="spark" viewBox="0 0 24 24">
                <path d="M12 3c.6 4.6 3.4 7.4 9 9-5.6 1.6-8.4 4.4-9 9-.6-4.6-3.4-7.4-9-9 5.6-1.6 8.4-4.4 9-9z" />
            </symbol>
            <symbol id="download" viewBox="0 0 24 24">
                <path d="M12 4v11M8 11l4 4 4-4M5 20h14" />
            </symbol>
            <symbol id="leaf" viewBox="0 0 24 24">
                <path d="M4 21C4 11 10 4 21 3c0 11-7 17-17 18z" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.500 1.500M17.500 17.500L19 19M5 19l1.500-1.500M17.500 6.500L19 5" />
            </symbol>
            <symbol id="moon" viewBox="0 0 24 24">
                <path d="M20 14.500A8 8 0 1 1 9.500 4a6.500 6.500 0 0 0 10.500 10.500z" />
            </symbol>
        </defs>
    </svg>

    <header class="top" id="top"></header>
    <div id="authGate" class="auth-gate" hidden></div>
    <div id="app">
        <div id="view"></div>
    </div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="over" id="over">
        <div class="panel" id="panel"></div>
    </div>
    <input type="file" id="fileAvatar" accept="image/*" hidden>
    <input type="file" id="fileRestore" accept="application/json,.json" hidden>

    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const ic = (n, c = '') => `<svg class="i ${c}"><use href="#${n}"/></svg>`;
        const LEGACY_KEY = 'amberpages.v1';
        const TOKEN_KEY = 'amberpages.auth.token';
        let authUser = null;
        const stateKey = () => authUser ? 'amberpages.v2.' + authUser.id : null;
        const apiFetch = (url, options = {}) => fetch(url, {...options, headers:{...(options.headers||{}), ...(localStorage.getItem(TOKEN_KEY)?{Authorization:'Bearer '+localStorage.getItem(TOKEN_KEY)}:{})}});
        const COVERS = [['#2f6f6a', '#12353a'], ['#c0563b', '#6b1f2a'], ['#d9b26f', '#7a5424'], ['#5b5bd6', '#1f1d5c'], ['#8aa98a', '#33503f'], ['#b47ab0', '#4a2152'], ['#3c4a6b', '#14132b'], ['#e0a1a1', '#8b3a4a']];
        const PALETTES = [{ n: 'Outono original', a: '#C8A36A', b: '#4B352A' }, { n: 'Luna estrelada', a: '#2A2F5C', b: '#0B0E23' }, { n: 'Sálvia', a: '#c9d8bd', b: '#1d241a' }, { n: 'Noite', a: '#2a3a6b', b: '#0a0f24' }, { n: 'Âmbar', a: '#f3b37a', b: '#5a2a0c' }, { n: 'Lavanda', a: '#ddd3f2', b: '#2a2050' }, { n: 'Rosa', a: '#f1c2c2', b: '#4a1a2a' }, { n: 'Carvão', a: '#4a4a5a', b: '#0b0b12' }];
        const STATUS = [['lido', 'Lidos'], ['lendo', 'Lendo'], ['quero', 'Quero ler'], ['emprestado', 'Emprestados'], ['releitura', 'Releituras'], ['abandonado', 'Abandonados']];
        const THEMES = [['ambar', 'Âmbar', '#A8702A'], ['luna', 'Luna', '#E8C547'], ['indigo', 'Índigo', '#5b5bd6'], ['noite', 'Noite', '#8b5cf6']];
        const SUGGEST = [['Dom Casmurro', 'Machado de Assis'], ['Memórias Póstumas de Brás Cubas', 'Machado de Assis'], ['Quincas Borba', 'Machado de Assis'], ['O Cortiço', 'Aluísio Azevedo'], ['Iracema', 'José de Alencar'], ['Senhora', 'José de Alencar'], ['O Guarani', 'José de Alencar'], ['A Moreninha', 'Joaquim Manuel de Macedo'], ['Triste Fim de Policarpo Quaresma', 'Lima Barreto'], ['O Ateneu', 'Raul Pompeia'], ['Os Sertões', 'Euclides da Cunha'], ['Orgulho e Preconceito', 'Jane Austen'], ['Drácula', 'Bram Stoker'], ['Frankenstein', 'Mary Shelley']];

        let S;
        function load() {
            try { S = JSON.parse(localStorage.getItem(stateKey())) } catch (e) { S = null }
            if (!S || typeof S !== 'object') S = {};
            S.user = Object.assign({ name: 'Leitor(a)', avatar: '', theme: 'ambar', phrase: 'Cada livro, um pedacinho de você.', featured: '', goal: 12, calm: false }, S.user || {});
            S.books = Array.isArray(S.books) ? S.books : [];
            S.log = Array.isArray(S.log) ? S.log : [];
            S.clubs = Array.isArray(S.clubs) ? S.clubs : [];
            S.ui = { tab: 'home', filter: 'lido', view: 'grade', col: '', q: '', cat: { q: '', state: 'idle', res: [] } };
        }
        // Estado da aplicação: sincronização completa com o Neon, sem alterar os IDs internos.
        const SNAPSHOT = () => ({ user: S.user, books: S.books, clubs: S.clubs, log: S.log });
        let syncTimer = null;
        let syncQueue = Promise.resolve();
        let initialized = false;
        let syncPending = false;

        function save(successMessage = null) {
            try { localStorage.setItem(stateKey(), JSON.stringify(SNAPSHOT())) }
            catch (e) { toast('Sem espaço para salvar. Tente uma foto menor.') }
            syncPending = true;
            if (!initialized) return;
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => {
                const payload = JSON.stringify(SNAPSHOT());
                syncQueue = syncQueue.catch(() => {}).then(async () => {
                    const r = await apiFetch('/api/state', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: payload
                    });
                    if (!r.ok) {
                        const info = await r.json().catch(() => ({}));
                        throw Error(info.error || 'HTTP ' + r.status);                        
                    }
                    syncPending = false;
                    if (successMessage) toast(successMessage);
                });
                syncQueue.catch(err => {
                    console.error('Erro ao salvar no Neon:', err);
                    toast('Dados mantidos neste navegador, mas NÃO gravados no Neon: ' + err.message);
                });
            }, 250);
        }

        async function initApp() {
            load();
            // Mostra a interface local enquanto a conexão é verificada.
            render();
            try {
                const r = await apiFetch('/api/state');
                if (!r.ok) throw Error('HTTP ' + r.status);
                const data = await r.json();
                if (data.state && Array.isArray(data.state.books)) {
                    if (syncPending) {
                        // Não descartar mudanças feitas durante a inicialização.
                        initialized = true;
                        save();
                        return;
                    }
                    S.user = Object.assign(S.user, data.state.user || {});
                    S.books = data.state.books;
                    S.clubs = Array.isArray(data.state.clubs) ? data.state.clubs : [];
                    S.log = Array.isArray(data.state.log) ? data.state.log : [];
                    localStorage.setItem(stateKey(), JSON.stringify(SNAPSHOT()));
                } else {
                    // Conta nova: inicia com estado vazio, sem importar dados de outro usuário.
                    const up = await apiFetch('/api/state', {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(SNAPSHOT())
                    });
                    if (!up.ok) throw Error('HTTP ' + up.status);
                }
                console.info('Amber Pages: sincronizado com Neon.');
            } catch (err) {
                console.error('Neon indisponível; usando cópia local:', err);
                toast('Não foi possível sincronizar com o Neon: ' + err.message + '. Os dados locais foram mantidos.');
            } finally {
                initialized = true;
                render(true);
            }
        }
        function toast(m) { alert(m) }
        const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
        const dkey = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
        const today = () => dkey();
        function logPages(id, n, date) { const b=byId(id); if(!b)return; n=Math.max(0,Math.round(+n||0)); if(b.pages>0)n=Math.min(n,Math.max(0,b.pages-(b.read||0))); if(!n)return; S.log.push({id:uid(),b:id,d:date||dkey(),p:n}); b.read=(b.read||0)+n; }
        function streakInfo() {
            const days = new Set(S.log.map(l => l.d));
            const back = d => { const x = new Date(d); x.setDate(x.getDate() - 1); return x };
            let cur = new Date(), n = 0;
            if (!days.has(dkey(cur))) cur = back(cur);
            while (days.has(dkey(cur))) { n++; cur = back(cur) }
            let best = 0, run = 0, prev = null;
            for (const k of [...days].sort()) { const [y, m, d] = k.split('-').map(Number); const t = new Date(y, m - 1, d); if (prev && Math.round((t - prev) / 864e5) === 1) run++; else run = 1; best = Math.max(best, run); prev = t }
            return { cur: n, best };
        }
        function weekData() { const out = []; for (let i = 6; i >= 0; i--) { const x = new Date(); x.setDate(x.getDate() - i); const k = dkey(x); out.push({ k, l: ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][x.getDay()], p: S.log.filter(l => l.d === k).reduce((t, l) => t + l.p, 0) }) } return out }
        const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}` };
        const byId = id => S.books.find(b => b.id === id);

        function coverHTML(b, extra = '') {
            const [c1, c2] = COVERS[(b.color || 0) % COVERS.length];
            const chip = b.rating ? `<span class="chip">${ic('star')}${Number(b.rating).toFixed(1)}</span>` : '';
            if (b.cover) return `<div class="cover ${extra}"><img src="${b.cover}" alt="">${chip}</div>`;
            return `<div class="cover ${extra}" style="background:linear-gradient(160deg,${c1},${c2})"><span class="ring"></span><span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author)}</span>${chip}</div>`;
        }
        const pct = b => b.pages > 0 ? Math.min(100, Math.round((b.read || 0) / b.pages * 100)) : 0;

        /* ---------- Views ---------- */
        const views = {};

        views.home = () => {
            const u = S.user, y = new Date().getFullYear();
            const lidos = S.books.filter(b => ['lido', 'releitura'].includes(b.status));
            const doneYear = lidos.filter(b => (b.date || '').startsWith(String(y))).length;
            const goal = Math.max(1, u.goal || 12), gp = Math.min(100, Math.round(doneYear / goal * 100));
            const pages = lidos.reduce((t, b) => t + (+b.pages || 0), 0);
            const reading = S.books.filter(b => b.status === 'lendo' || b.rereading); const st = streakInfo(), wk = weekData(), wmax = Math.max(1, ...wk.map(x => x.p));
            const feat = byId(u.featured) || lidos[0] || S.books[0];
            const h = new Date().getHours(), hi = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
            const leaves = [...Array(9)].map((_, i) => `<svg class="lf" style="left:${(i * 37 + 8) % 92}%;top:${(i * 23 + 6) % 78}%;--s:${22 + (i * 7) % 22}px;rotate:${i * 40}deg;animation-duration:${5 + (i % 4)}s;animation-delay:-${i}s"><use href="#leaf"/></svg>`).join('');
            const stars = [...Array(26)].map((_, i) => `<i style="left:${(i * 53 + 11) % 98}%;top:${(i * 31 + 7) % 92}%;animation-delay:-${(i % 7) * .5}s"></i>`).join('');
            const ach = [['Primeira página', 'Registrou o primeiro livro', S.books.length >= 1, 'book'], ['Leitor dedicado', '5 livros lidos', lidos.length >= 5, 'star'], ['Estante cheia', '10 livros lidos', lidos.length >= 10, 'shelf'], ['Mil páginas', '1000 páginas lidas', pages >= 1000, 'spark'], ['Meta batida', 'Meta do ano cumprida', doneYear >= goal, 'target']];
            const tl = [...lidos].filter(b => b.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
            const qs = S.books.filter(b => b.note && b.note.length <= 220).slice(0, 4);
            const stars5 = n => `<div class="rate">${[1, 2, 3, 4, 5].map(i => `<span style="opacity:${Math.round(n) >= i ? 1 : .25}">${ic('star')}</span>`).join('')}</div>`;
            return `<div>
<section class="hero"><div class="sky">${stars}</div>${leaves}
<div class="small">${hi}, ${esc(u.name.split(' ')[0])}</div><h1>Amber Pages</h1><p>${esc(u.phrase)}</p>
<div class="acts"><button class="pill gold" data-act="addBook" data-id="quero">${ic('plus')}Adicionar livro</button><button class="pill ghost" data-act="tab" data-id="biblioteca">Ver biblioteca</button></div>
<button class="pill ghost" style="margin-top:12px;padding:7px 14px;font-size:12px" data-act="editPhrase">${ic('pencil')}Editar frase</button></section>

<div class="sect"><div class="sect-t"><span>Seu painel</span><h2>Sua jornada</h2></div>
<div class="dash"><div class="dcard"><b>${lidos.length}</b><span>livros lidos</span></div><div class="dcard"><b>${pages}</b><span>páginas lidas</span></div>
<div class="dcard"><b>${st.cur}</b><span>dia${st.cur === 1 ? '' : 's'} de sequência</span></div><div class="dcard"><b>${S.books.filter(b => b.status === 'quero').length}</b><span>na fila</span></div></div></div>

${reading.length ? `<div class="sect"><div class="sect-t"><span>Continue de onde parou</span><h2>Sua leitura atual</h2></div><div class="card reading-feature">${reading.slice(0,2).map(b=>`<div class="row" style="align-items:flex-start;gap:16px"><button data-act="openBook" data-id="${b.id}" class="reading-cover">${coverHTML(b)}</button><div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div><div class="bar" style="margin:12px 0 6px"><i style="width:${pct(b)}%"></i></div><div class="muted">Página ${b.read||0}${b.pages?' de '+b.pages:''} · ${pct(b)}%</div><button class="pill primary" style="margin-top:12px" data-act="pageSheet" data-id="${b.id}">${ic('plus')}Registrar páginas</button></div></div>`).join('')}</div></div>` : ''}
<div class="sect"><div class="sect-t"><span>Registro de leitura</span><h2>Sua semana</h2></div>
<div class="card"><div class="week">${wk.map(x => `<div><i style="height:${Math.round(x.p / wmax * 64) + 4}px;opacity:${x.p ? 1 : .25}"></i><small>${x.l}</small></div>`).join('')}</div>
<div class="row between" style="margin-top:12px;gap:10px"><span class="muted">${wk.reduce((t, x) => t + x.p, 0)} págs na semana · melhor sequência ${st.best} dia${st.best === 1 ? '' : 's'}</span><button class="pill primary" style="flex:none" data-act="logRead">${ic('plus')}Registrar</button></div></div></div>

${feat ? `<div class="sect"><div class="sect-t"><span>Livro em destaque</span><h2>${esc(feat.title)}</h2></div>
<div class="card row" style="align-items:flex-start"><button data-act="openBook" data-id="${feat.id}" style="width:96px;flex:none">${coverHTML(feat)}</button>
<div class="grow"><span class="tag">${esc(STATUS.find(s => s[0] === feat.status)?.[1] || '')}</span><div class="muted" style="margin-top:8px">${esc(feat.author)}</div>${feat.rating ? stars5(feat.rating) : ''}
<div class="chips" style="margin-top:6px"><button class="pill soft" style="padding:8px 14px" data-act="pickFeatured">Trocar</button><button class="pill" style="padding:8px 14px" data-act="share" data-id="${feat.id}">${ic('share')}Story</button></div></div></div>
${(feat.note || feat.review) ? `<blockquote class="bq" style="margin-top:14px">${esc((feat.note || feat.review).slice(0, 220))}<small>${esc(feat.title)}</small></blockquote>` : ''}</div>` : ''}

<div class="sect"><div class="sect-t"><span>Agora</span><h2>Lendo agora</h2></div>
${reading.length ? `<div class="list">${reading.map(b => `<div class="card"><div class="row" style="align-items:flex-start">
<button data-act="openBook" data-id="${b.id}" style="width:72px;flex:none">${coverHTML(b)}</button>
<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div>
<div class="bar" style="margin:12px 0 6px"><i style="width:${pct(b)}%"></i></div>
<div class="muted">${b.read || 0}${b.pages ? ` de ${b.pages}` : ''} págs · ${pct(b)}%</div>
<div class="chips" style="margin-top:10px"><button class="pill soft" style="padding:8px 14px" data-act="pageSheet" data-id="${b.id}">${ic('plus')}Registrar páginas</button><button class="pill" style="padding:8px 14px" data-act="finish" data-id="${b.id}">${ic('check')}Terminei</button></div></div></div></div>`).join('')}</div>`
                    : `<div class="card empty" style="padding:26px"><p style="margin:0 0 12px">Nenhum livro em andamento.</p><button class="pill primary" data-act="addBook" data-id="lendo">${ic('plus')}Começar um livro</button></div>`}</div>

<div class="sect"><div class="sect-t"><span>Metas</span><h2>Meta de ${y}</h2></div>
<div class="card"><div class="row between"><b>${doneYear} de ${goal} livros</b><span class="muted">${gp}%</span></div><div class="bar" style="margin:12px 0"><i style="width:${gp}%"></i></div>
<button class="pill soft" style="padding:8px 14px" data-act="editGoal">${ic('target')}Mudar meta</button></div></div>

<div class="sect"><div class="sect-t"><span>Troféus</span><h2>Conquistas</h2></div>
<div class="ach">${ach.map(([t, d, on, i]) => `<div class="acard ${on ? '' : 'off'}">${ic(i)}<b>${t}</b><span>${d}</span></div>`).join('')}</div></div>

${C.state === 'ok' || C.state === 'empty' || C.state === 'error' ? `${C.state === 'ok' ? `<div class="list">${resHTML}</div>` : ''}
<div class="card row between" style="gap:12px"><div><b>Não achou o livro?</b><div class="muted">O livro existe mesmo se o catálogo não achar.</div></div><button class="pill soft" style="flex:none" data-act="addManual">${ic('plus')}Adicionar mesmo assim</button></div>` : ''}

${C.state === 'idle' && S.books.length ? `<div class="card"><div class="eyebrow">Inspirado na sua estante</div><h2 style="margin:6px 0">Descubra pelo seu gosto</h2><p class="muted">Pesquise outros livros de autores que você já lê.</p><div class="chips">${[...new Set(S.books.map(b=>b.author).filter(Boolean))].slice(0,4).map(a=>`<button class="pill soft" data-act="authorSearch" data-q="${esc(a)}" style="padding:8px 12px">${esc(a)}</button>`).join('')}</div></div>` : ''}

            else if (v === 'lista') body = `<div class="list">${list.map(b => `<button class="item" data-act="openBook" data-id="${b.id}">${coverHTML(b)}<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}${b.date && b.status === 'lido' ? ' · ' + fmtDate(b.date) : ''}${b.status === 'emprestado' && b.lentTo ? ' · com ' + esc(b.lentTo) : ''}</div></div>${b.rating ? `<span class="pill soft" style="padding:6px 10px">${ic('star')}${Number(b.rating).toFixed(1)}</span>` : ''}</button>`).join('')}</div>`;

<div class="stats"><button class="${f === 'todos' ? 'on' : ''}" data-act="filter" data-id="todos"><b>${S.books.length}</b><span>Todos</span></button>${STATUS.map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="filter" data-id="${k}"><b>${counts[k]}</b><span>${l}</span></button>`).join('')}</div>

        views.clubes = () => {
            return `<div class="stack"><div class="hdr"><div><div class="eyebrow">Leiam juntos</div><h1>Clubes</h1></div><button class="iconbtn primary" data-act="addClub" aria-label="Criar clube">${ic('plus')}</button></div>

                const ms = [...c.members].sort((a, b) => b.pages - a.pages);

<div class="muted" style="text-align:center">Os clubes desta etapa ainda são individuais. Clubes compartilhados e ranking entre contas serão implementados na etapa social.</div></div>`;
        };

        function postShareSheet(){const p=communityState.sharePost;if(!p)return;const f=communityState.shareFormat;openSheet(`<div class="row between"><h2>Compartilhar publicação</h2><button class="iconbtn" data-act="close">${ic('close')}</button></div><p class="muted">Crie um PNG para Story, feed ou sobreposição transparente.</p><div class="chips" style="margin:12px 0">${[['story','Story 9:16'],['square','Post 1:1'],['transparent','PNG transparente']].map(([k,v])=>`<button class="pill ${f===k?'primary':'soft'}" data-act="postShareFormat" data-id="${k}">${v}</button>`).join('')}</div><div class="share-options"><label>Layout <select id="shareStyle" class="in"><option value="editorial" ${communityState.shareStyle==='editorial'?'selected':''}>Editorial</option><option value="minimal" ${communityState.shareStyle==='minimal'?'selected':''}>Minimalista</option></select></label><label>Humor <select id="shareMood" class="in">${['curiosa','ansiosa','melancólica','apaixonada','surpresa','feliz'].map(m=>`<option value="${m}" ${communityState.shareMood===m?'selected':''}>${m}</option>`).join('')}</select></label><label>Progresso (%) <input id="sharePct" class="in" type="number" min="0" max="100" value="${communityState.sharePct}"></label><label>Fundo <select id="shareBg" class="in"><option value="gradient" ${communityState.shareBg==='gradient'?'selected':''}>Degradê</option><option value="solid" ${communityState.shareBg==='solid'?'selected':''}>Cor sólida</option><option value="transparent" ${communityState.shareBg==='transparent'?'selected':''}>Transparente</option></select></label><label>Cor <input id="shareColor" type="color" value="${communityState.shareColor}" aria-label="Cor do fundo"></label><button class="pill soft" data-act="postShareApply">Atualizar prévia</button></div><canvas id="postShareCanvas" class="post-share-canvas" aria-label="Prévia da publicação"></canvas><p class="muted">O texto pode ser resumido na imagem para manter a leitura confortável. A publicação original permanece completa.</p><div class="chips"><button class="pill primary" data-act="postShareDownload">${ic('download')} Baixar PNG</button><button class="pill soft" data-act="postShareNative">${ic('share')} Compartilhar</button><button class="pill soft" data-act="postShareCopy">Copiar texto</button></div>`);drawPostShare().catch(e=>toast('Não foi possível preparar a prévia.'))}
        function postShareWrap(ctx,text,x,y,maxWidth,lineHeight,maxLines){const words=String(text||'').split(/\s+/),lines=[];let line='';for(const w of words){const candidate=line?line+' '+w:w;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=w}else line=candidate}if(line)lines.push(line);for(let i=0;i<Math.min(maxLines,lines.length);i++){let l=lines[i];if(i===maxLines-1&&lines.length>maxLines)l=l.replace(/\s*\S+$/,'')+'…';ctx.fillText(l,x,y+i*lineHeight)}return y+Math.min(maxLines,lines.length)*lineHeight}
        async function drawPostShare(){const cv=$('#postShareCanvas'),p=communityState.sharePost;if(!cv||!p)return;const fmt=communityState.shareFormat,transparent=fmt==='transparent'||communityState.shareBg==='transparent',W=1080,H=fmt==='story'?1920:fmt==='square'?1080:700;cv.width=W;cv.height=H;const ctx=cv.getContext('2d'),luna=['luna','noite','indigo'].includes(S.user.theme);if(!transparent){if(communityState.shareBg==='solid'){ctx.fillStyle=communityState.shareColor;ctx.fillRect(0,0,W,H)}else{const gr=ctx.createLinearGradient(0,0,W,H);gr.addColorStop(0,luna?'#1b2342':'#c8a36a');gr.addColorStop(1,luna?'#0b0e23':'#4b352a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}}const fg=transparent?'#4b352a':'#ffffff';ctx.fillStyle=fg;ctx.textAlign='center';ctx.font='700 44px Poppins,sans-serif';ctx.fillText('AMBER PAGES',W/2,fmt==='story'?120:68);if(communityState.shareStyle!=='minimal'){ctx.font='italic 30px Poppins,sans-serif';ctx.fillText('✦ '+communityState.shareMood+' · '+communityState.sharePct+'% ✦',W/2,fmt==='story'?175:113)}let y=fmt==='story'?210:135;if(p.book_cover){const img=await loadImg(p.book_cover);if(img){const cw=fmt==='story'?370:fmt==='square'?240:210,ch=cw*1.45;ctx.save();ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=30;const scale=Math.min(cw/img.width,ch/img.height);ctx.drawImage(img,(W-img.width*scale)/2,y,img.width*scale,img.height*scale);ctx.restore();y+=ch+48}}ctx.fillStyle=fg;ctx.font='700 48px "Cormorant Garamond",serif';y=postShareWrap(ctx,p.book_title||'Minha publicação literária',W/2,y,W-140,54,2)+16;ctx.font='28px Poppins,sans-serif';if(communityState.shareStyle!=='minimal'&&p.book_author){ctx.fillText(p.book_author.slice(0,55),W/2,y);y+=48}if(communityState.shareStyle!=='minimal'&&p.rating){ctx.fillStyle=transparent?'#8d5b2b':'#ffd166';ctx.font='46px Poppins,sans-serif';ctx.fillText('★'.repeat(Math.round(p.rating))+'☆'.repeat(5-Math.round(p.rating)),W/2,y);y+=64}ctx.fillStyle=fg;ctx.font='italic 35px "Cormorant Garamond",serif';const maxLines=fmt==='story'?9:fmt==='square'?5:3;const text=p.spoiler?'⚠️ Esta publicação contém spoilers. Leia no Amber Pages.':p.content;postShareWrap(ctx,text,W/2,y+24,W-160,47,maxLines);ctx.font='26px Poppins,sans-serif';ctx.globalAlpha=.88;ctx.fillText('por '+p.name,W/2,H-55);ctx.globalAlpha=1}
        const communityState = {people:[],posts:[],q:'',loading:false,error:'',type:'livre',book:null,results:[],searching:false,spoiler:false,sharePost:null,shareFormat:'story',shareTransparent:false,shareMood:'curiosa',sharePct:39,shareStyle:'editorial',shareBg:'gradient',shareColor:'#b68b60',comments:{},notifications:[],clubs:[],clubMessages:[],openClub:null};
        const postTypes = {livre:'Publicação livre',resenha:'Resenha',comentario:'Discussão',citacao:'Citação',progresso:'Atualização de leitura',concluido:'Leitura concluída'};
        const postBook = p => p.book_title ? `<div class="post-book">${p.book_cover?`<img src="${esc(p.book_cover)}" alt="Capa de ${esc(p.book_title)}" loading="lazy" referrerpolicy="no-referrer">`:''}<div><b>${esc(p.book_title)}</b><div class="muted">${esc(p.book_author||'Autor não informado')}</div>${p.rating?`<div class="post-stars">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5-Math.round(p.rating))}</div>`:''}</div></div>` : '';
        function renderPost(p) {return `<div class="card community-post"><div class="row between"><b>${esc(p.name)}</b><small class="muted">${esc(new Date(p.created_at).toLocaleDateString('pt-BR'))}</small></div><div class="eyebrow" style="margin:12px 0 8px">${esc(postTypes[p.post_type]||'Publicação')}</div>${postBook(p)}${p.spoiler?`<div class="spoiler-wrap"><button class="pill soft" data-act="revealSpoiler" type="button">⚠️ Contém spoilers · revelar texto</button><p class="post-content" hidden>${esc(p.content)}</p></div>`:`<p class="post-content">${esc(p.content)}</p>`}<div class="row" style="gap:8px;flex-wrap:wrap"><button class="pill ${p.liked?'primary':'soft'}" data-act="communityLike" data-id="${esc(p.id)}">♥ ${p.likes||0} ${p.liked?'Curtido':'Curtir'}</button><button class="pill soft" data-act="communityComments" data-id="${esc(p.id)}">💬 ${p.comments_count||0} comentários</button><button class="pill soft" data-act="postShare" data-id="${esc(p.id)}">${ic('share')} Gerar PNG</button>${p.mine?`<button class="pill soft" data-act="communityDelete" data-id="${esc(p.id)}">Excluir publicação</button>`:''}</div>${communityState.comments[p.id]?`<div class="comment-panel"><h3>Comentários</h3>${communityState.comments[p.id].map(c=>`<div class="comment"><b>${esc(c.name)}</b><p>${esc(c.content)}</p>${c.mine?`<button class="pill soft" data-act="communityDeleteComment" data-id="${esc(c.id)}" data-post="${esc(p.id)}">Excluir</button>`:''}</div>`).join('')}<div class="row"><input class="in grow" id="comment-${esc(p.id)}" maxlength="1000" placeholder="Escreva um comentário"><button class="pill primary" data-act="communitySendComment" data-id="${esc(p.id)}">Enviar</button></div></div>`:''}</div>`}
        function postComposer(){const t=communityState.type, b=communityState.book;return `<div class="card"><h2>Compartilhe sua leitura</h2><p class="muted">Publique somente o que você escolher. Suas anotações e sua biblioteca permanecem privadas.</p><label class="f" for="postType">Tipo de publicação</label><select id="postType" class="in" style="width:100%">${Object.entries(postTypes).map(([k,v])=>`<option value="${k}" ${t===k?'selected':''}>${v}</option>`).join('')}</select>${t!=='livre'?`<div class="post-chooser"><h3>Escolha o livro</h3><p class="muted">Selecione um livro da sua biblioteca ou pesquise no catálogo.</p>${b?`<div class="item">${b.cover?`<img class="post-mini-cover" src="${esc(b.cover)}" alt="">`:''}<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author||'')}</div></div><button class="pill soft" data-act="postClearBook">Trocar</button></div>`:`<select class="in" id="postLibrary" style="width:100%"><option value="">Selecionar da minha biblioteca…</option>${S.books.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} — ${esc(x.author||'')}</option>`).join('')}</select><div class="row" style="margin-top:10px"><input class="in grow" id="postCatalogQuery" placeholder="Título, autor ou ISBN" maxlength="120"><button class="pill soft" data-act="postCatalogSearch">Buscar</button></div>${communityState.searching?'<p class="muted">Pesquisando catálogo…</p>':''}<div class="post-results">${communityState.results.map((x,i)=>`<button class="post-result" data-act="postPickCatalog" data-id="${i}">${x.cover?`<img src="${esc(x.cover)}" alt="" loading="lazy">`:''}<span><b>${esc(x.title)}</b><small>${esc(x.author||'')}</small></span></button>`).join('')}</div>`}</div>`:''}${['resenha','concluido'].includes(t)?`<label class="f" for="postRating">Minha avaliação (opcional)</label><select class="in" id="postRating" style="width:100%"><option value="0">Sem avaliação</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select>`:''}<label class="f" for="communityText">${t==='resenha'?'Sua resenha':t==='citacao'?'Trecho ou citação':t==='livre'?'Sua mensagem':'Sua publicação'}</label><textarea class="in" id="communityText" maxlength="2000" rows="4" placeholder="${t==='resenha'?'O que você achou deste livro?':t==='comentario'?'Que assunto você quer discutir?':'Compartilhe sua experiência literária…'}" style="width:100%;resize:vertical"></textarea><label class="post-check"><input type="checkbox" id="postSpoiler" ${communityState.spoiler?'checked':''}> Esta publicação contém spoilers</label><button class="pill primary" data-act="communityPost" style="margin-top:10px">Publicar</button></div>`}

        async function refreshCommunity(){
            communityState.loading=true; render(true);
            try {
                const [a,b,n,c]=await Promise.all([apiFetch('/api/community/people?q='+encodeURIComponent(communityState.q)),apiFetch('/api/community/feed'),apiFetch('/api/community/notifications'),apiFetch('/api/community/clubs')]);

                communityState.posts=(await b.json()).posts||[];

        function resizeImg(file, max, q) {
            return new Promise(res => {
                const r = new FileReader();
                r.onload = () => {
                    const im = new Image(); im.onload = () => {
                        const k = Math.min(1, max / Math.max(im.width, im.height));
                        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
                        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q))
                    }; im.src = r.result
                };
                r.readAsDataURL(file);
            });
        }

        function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() }
        function wrap(ctx, t, x, y, maxW, lh) { const w = t.split(' '); let line = '', yy = y; for (const p of w) { const tt = line ? line + ' ' + p : p; if (ctx.measureText(tt).width > maxW && line) { ctx.fillText(line, x, yy); line = p; yy += lh } else line = tt } ctx.fillText(line, x, yy); return yy }
        async function drawShare(canvas) {
            const b = byId(SH.id); if (!b) return;
            const W = 1080, H = SH.fmt === 'story' ? 1920 : 1080; canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d'), p = PALETTES[SH.pal];
            const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, p.a); g.addColorStop(1, p.b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            const story = SH.fmt === 'story';
            if (SH.deco) {
                ctx.save(); ctx.globalAlpha=.22; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
                for(let i=0;i<20;i++) { const x=(i*193+85)%W, y=(i*317+110)%H; if(SH.pal===1 || S.user.theme==='luna') { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill(); } else { ctx.beginPath();ctx.ellipse(x,y,8,17,(i%5)*.6,0,Math.PI*2);ctx.stroke(); } }
                ctx.restore();
            }
            const cw = story ? 420 : 300, ch = cw * 1.5, cx = (W - cw) / 2, cy = story ? 330 : 90;
            ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; rr(ctx, cx, cy, cw, ch, 22); ctx.fillStyle = '#222'; ctx.fill(); ctx.restore();
            ctx.save(); rr(ctx, cx, cy, cw, ch, 22); ctx.clip();
            if (b.cover) { const im = await loadImg(b.cover); if (im) { const k = Math.max(cw / im.width, ch / im.height); ctx.drawImage(im, cx + (cw - im.width * k) / 2, cy + (ch - im.height * k) / 2, im.width * k, im.height * k) } }
            else {
                const [c1, c2] = COVERS[(b.color || 0) % COVERS.length]; const gg = ctx.createLinearGradient(cx, cy, cx + cw, cy + ch); gg.addColorStop(0, c1); gg.addColorStop(1, c2); ctx.fillStyle = gg; ctx.fillRect(cx, cy, cw, ch);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = `700 ${story ? 46 : 34}px "Cormorant Garamond",serif`; wrap(ctx, b.title, cx + 28, cy + 70, cw - 56, story ? 48 : 36);
                ctx.font = `500 ${story ? 20 : 15}px Inter,sans-serif`; ctx.globalAlpha = .85; ctx.fillText((b.author || '').toUpperCase().slice(0, 28), cx + 28, cy + ch - 34); ctx.globalAlpha = 1
            }
            ctx.restore();
            ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
            let y = cy + ch + (story ? 110 : 70);
            ctx.font = `700 ${story ? 58 : 46}px Inter,sans-serif`; y = wrap(ctx, b.title, W / 2, y, W - 160, story ? 68 : 54);
            ctx.font = `500 ${story ? 32 : 26}px Inter,sans-serif`; ctx.globalAlpha = .8; ctx.fillText(b.author || '', W / 2, y + (story ? 56 : 44)); ctx.globalAlpha = 1;

            if (SH.detail !== 'minimal' && b.rating) { ctx.font = `${story ? 64 : 50}px Inter,sans-serif`; ctx.fillStyle = '#ffd166'; ctx.fillText('★'.repeat(Math.round(b.rating)) + '☆'.repeat(5 - Math.round(b.rating)), W / 2, y); y += story ? 70 : 54 }
            const fr = SH.detail === 'quote' ? (b.note || b.review) : ''; if (fr && story) { ctx.fillStyle = '#fff'; ctx.font = 'italic 500 40px "Cormorant Garamond",serif'; ctx.globalAlpha = .92; wrap(ctx, '“' + fr.slice(0, 140) + '”', W / 2, y + 40, W - 220, 50); ctx.globalAlpha = 1 }
            if(SH.detail === 'progress' && b.pages > 0) {
                const progress=Math.min(100,Math.round((b.read||0)/b.pages*100));
                ctx.fillStyle='rgba(255,255,255,.28)';rr(ctx,170,H-(story?320:155),740,22,11);ctx.fill();
                ctx.fillStyle='#fff';rr(ctx,170,H-(story?320:155),740*progress/100,22,11);ctx.fill();
                ctx.textAlign='center';ctx.font='600 27px Poppins,sans-serif';ctx.fillText('Página '+(b.read||0)+' de '+b.pages+' · '+progress+'%',W/2,H-(story?268:112));
            }

            ctx.font = '500 22px Inter,sans-serif'; ctx.globalAlpha = .6; const sk = streakInfo().cur; const meta = [b.pages ? b.pages + ' págs' : '', sk ? 'sequência ' + sk + 'd' : '', b.status === 'lendo' ? 'lendo agora' : b.status === 'lido' ? 'lido' : ''].filter(Boolean).join(' · '); if (story) ctx.fillText(meta, W / 2, H - 100); ctx.globalAlpha = 1;

        /* ---------- Importar histórico ---------- */
        const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
        const pad = n => String(n).padStart(2, '0');
        function toISO(s) { s = (s || '').trim(); let m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`; m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`; return '' }
        function parseCSV(text) {
            text = String(text).replace(/^﻿/, '');
            const head = text.split(/\r?\n/)[0] || '';
            const d = head.split(';').length > head.split(',').length ? ';' : ',';
            const rows = []; let row = [], cur = '', q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++ } else q = false } else cur += c }
                else if (c === '"') q = true;
                else if (c === d) { row.push(cur); cur = '' }
                else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = [] }
                else cur += c;
            }
            row.push(cur); if (row.some(x => x.trim())) rows.push(row);
            return rows;
        }
        const COLS = { title: ['title', 'titulo', 'livro', 'nome', 'book'], author: ['author', 'autor', 'autores', 'autora'], pages: ['number of pages', 'paginas', 'pages', 'num pages', 'numero de paginas'], rating: ['my rating', 'nota', 'rating', 'minha nota', 'nota original', 'avaliacao'], status: ['exclusive shelf', 'shelf', 'status', 'estante', 'situacao'], date: ['date read', 'data de leitura', 'lido em', 'data leitura', 'data', 'data lida'], review: ['my review', 'resenha', 'review', 'opiniao', 'comentario'] };
        function mapRows(rows, mode) {
            if (rows.length < 2) return [];
            const H = rows[0].map(norm), idx = {};
            for (const k in COLS) idx[k] = H.findIndex(h => COLS[k].includes(h));
            if (idx.title < 0) return null;
            const get = (r, k) => idx[k] >= 0 ? (r[idx[k]] || '').trim() : '';
            return rows.slice(1).map(r => {
                const title = get(r, 'title'); if (!title) return null;
                const st = norm(get(r, 'status'));
                let status = 'quero';
                if (/(releitura|re-read|reler)/.test(st)) status = 'releitura';
                else if (/(currently|lendo|reading)/.test(st)) status = 'lendo';
                else if (/^(read|lido|lidos|finalizado|concluido)/.test(st)) status = 'lido';
                let rating = parseFloat(get(r, 'rating').replace(',', '.'));
                if (!(rating > 0)) rating = 0; rating = Math.min(5, rating);
                if (rating && mode === 'up') rating = Math.ceil(rating);
                if (rating && mode === 'down') rating = Math.max(1, Math.floor(rating));
                const pages = parseInt(get(r, 'pages'), 10) || 0;
                let h = 0; for (const ch of title) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
                return { id: uid(), title, author: get(r, 'author'), pages, read: status === 'lido' ? pages : 0, status, rating, date: toISO(get(r, 'date')), color: h % COVERS.length, colecao: '', note: '', review: get(r, 'review'), cover: '' };
            }).filter(Boolean);
        }
        let IMP = { src: 'gr', text: '', name: '' };
        function importSheet() {
            IMP = { src: 'gr', text: '', name: '' };
            const help = { gr: ['No Goodreads: Meus livros → Importar e exportar → Exportar biblioteca.', 'Na Maratona: exporte sua estante em CSV pelas configurações.'], sk: ['O Skoob não tem exportação oficial. Use um CSV com as colunas Título, Autor, Páginas, Nota, Estante, Data e Resenha.', 'Baixe o modelo abaixo para ver o formato.'] };
            const paint = () => { $('#srcHelp').innerHTML = '<ol class="steps">' + help[IMP.src].map(t => `<li>${t}</li>`).join('') + '</ol>';[...$('#srcSeg').children].forEach(b => b.classList.toggle('on', b.dataset.s === IMP.src)) };
            openSheet(`<div class="row between"><h2>Importar histórico</h2><button class="iconbtn" data-act="close" aria-label="Fechar">${ic('close')}</button></div>
<div class="card" style="margin-top:14px"><b>Traga o histórico de outros apps</b><div class="muted" style="margin-top:4px">Cada livro do arquivo entra na sua biblioteca. O que já existe é ignorado.</div></div>
<label class="f">De onde vem o arquivo?</label><div class="seg" id="srcSeg" style="width:100%"><button type="button" class="on" data-s="gr" style="flex:1;justify-content:center">Goodreads / Maratona</button><button type="button" data-s="sk" style="flex:1;justify-content:center">Skoob</button></div>
<div class="card" id="srcHelp" style="margin-top:12px"></div>
<label class="f">Nota original</label><select class="in" id="impMode"><option value="keep">Manter nota original (ex.: 3,5)</option><option value="up">Arredondar para cima</option><option value="down">Arredondar para baixo</option></select>
<div class="chips" style="margin-top:14px"><button type="button" class="pill soft" id="impPick">${ic('folder')}Escolher arquivo CSV</button><span class="muted" id="impName">nenhum arquivo</span></div><input type="file" id="impFile" accept=".csv,text/csv,text/plain" hidden>
<div class="sheetbtns"><button type="button" class="pill" data-act="tplCsv">Modelo CSV</button><button type="button" class="pill primary" id="impGo" disabled>Importar</button></div>`);
            paint();
            $('#srcSeg').onclick = e => { const t = e.target.closest('[data-s]'); if (t) { IMP.src = t.dataset.s; paint() } };
            $('#impPick').onclick = () => $('#impFile').click();
            $('#impFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; IMP.text = await f.text(); IMP.name = f.name; $('#impName').textContent = f.name; $('#impGo').disabled = false };
            $('#impGo').onclick = () => {
                const books = mapRows(parseCSV(IMP.text), $('#impMode').value);
                if (books === null) { toast('Não achei a coluna de título no arquivo. Baixe o modelo CSV para ver o formato.'); return }
                if (!books.length) { toast('O arquivo não tem livros.'); return }
                runImport(books);
            };
        }
        function runImport(books) {
            const N = books.length, seen = new Set(S.books.map(b => norm(b.title) + '|' + norm(b.author)));
            let i = 0, added = 0, skipped = 0; const pending = [];
            const draw = () => { const p = Math.round(i / N * 100); $('#panel').innerHTML = `<div class="grab"></div><h2>Importar histórico</h2><div class="card prog"><div class="big">${p}%</div><div class="bar"><i style="width:${p}%"></i></div><b>${i} de ${N} livros analisados</b><div class="muted" style="margin-top:4px">Faltam ${N - i} livros</div></div><p class="muted" style="text-align:center">Com muitos livros pode demorar um pouco. Deixe a página aberta.</p>` };
            draw();
            const step = () => {
                const end = Math.min(N, i + 10);
                for (; i < end; i++) {
                    const b = books[i], key = norm(b.title) + '|' + norm(b.author);
                    if (seen.has(key)) { skipped++; continue }
                    seen.add(key); S.books.push(b); added++;
                    if (b.review && !b.rating) pending.push(b.id);
                }
                draw();
                if (i < N) setTimeout(step, 30); else finish();
            };
            const finish = () => {
                save(); render(true);
                openSheet(`<h2>Importação concluída</h2><div class="kpis" style="margin-top:14px"><div class="card kpi"><b>${added}</b><span>livros adicionados</span></div><div class="card kpi"><b>${skipped}</b><span>já existiam</span></div></div>
${pending.length ? `<p class="muted" style="margin-top:14px">${pending.length} resenha${pending.length > 1 ? 's estão' : ' está'} sem nota. Você pode dar uma nota agora ou pular.</p>` : ''}
<div class="sheetbtns"><button class="pill" data-act="close">Fechar</button>${pending.length ? `<button class="pill primary" data-act="rateList" data-id="${pending.join(',')}">Dar notas</button>` : ''}</div>`);
            };
            setTimeout(step, 60);
        }
        function rateSheet(ids) {
            const cards = ids.map(byId).filter(Boolean).map(b => `<div class="card" data-rate="1" style="margin-top:12px"><b>${esc(b.title)}</b><div class="rv">${esc((b.review || '').slice(0, 220))}</div>
<div class="row between"><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-act="rateStar" data-id="${b.id}" data-n="${n}" aria-label="${n} estrelas">${ic('star')}</button>`).join('')}</div><button class="pill" style="padding:8px 14px" data-act="skipRate">Pular</button></div></div>`).join('');
            openSheet(`<div class="row between"><h2>Resenhas sem nota</h2><button class="iconbtn" data-act="close" aria-label="Fechar">${ic('close')}</button></div><p class="muted" style="margin-top:8px">Toque em uma estrela para dar a nota (a estrela tocada define a nota) ou pule.</p>${cards}`);
        }

        /* ---------- Catálogo, registro e retrospectiva ---------- */
        async function searchCatalog(q) {
            q = q.trim();
            const C = S.ui.cat = S.ui.cat || {};
            C.q = q;
            if (q) rememberSearch(q);
            if (!q) { C.state = 'idle'; C.res = []; render(true); return; }
            C.state = 'loading'; C.res = []; render(true);
            try {
                const response = await fetch('/api/catalog/search?q=' + encodeURIComponent(q));
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'HTTP ' + response.status);
                // Evita que uma pesquisa anterior sobrescreva a mais recente.
                if (S.ui.cat !== C || C.q !== q) return;
                C.res = Array.isArray(data.books) ? data.books : [];
                C.state = C.res.length ? 'ok' : 'empty';
                C.source = data.source || '';
                C.warning = data.warning || '';
            } catch (error) {
                if (S.ui.cat !== C || C.q !== q) return;
                C.state = 'error'; C.res = [];
                console.error('Falha na busca do catálogo:', error);
                C.warning = error.message;
            }
            render(true);
        }
        function addFromCatalog(r, status) {
            const h = [...r.title].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 0);
            const b = { id: uid(), title: r.title, author: r.author, pages: r.pages, read: 0, status, rating: 0, date: '', color: h % COVERS.length, colecao: '', note: '', review: '', synopsis: r.synopsis, cover: r.cover, rereads: 0 };
            S.books.unshift(b); save(); render(true);
            if (r.cover) inlineCover(b.id, r.cover);
        }
        async function inlineCover(id, url) {
            try { const r = await fetch(url); if (!r.ok) return; const d = await resizeImg(await r.blob(), 320, .8); const b = byId(id); if (b && b.cover === url) { b.cover = d; save(); render(true) } } catch (e) { }
        }
        // Etapa 2: registro de página atual ou páginas adicionais, com teclado acessível.
        function pageSheet(id) {
            const b=byId(id); if(!b)return;
            let mode='current', digits=String(Math.max(0,b.read||0));
            openSheet(`<div class="row between"><div><div class="eyebrow">Diário de leitura</div><h2>${esc(b.title)}</h2><div class="muted">${esc(b.author)} · ${b.pages?b.pages+' páginas':'total de páginas não informado'}</div></div><button class="iconbtn" data-act="close" aria-label="Fechar">${ic('close')}</button></div>
            <div class="seg page-modes" style="margin:18px 0"><button type="button" class="on" data-mode="current">Página atual</button><button type="button" data-mode="add">Páginas lidas</button></div>
            <div class="page-readout" aria-live="polite"><strong id="pageValue">${esc(digits)}</strong><span id="pageHint">Em qual página você está?</span></div>
            <div class="bar" style="margin:12px 0"><i id="pageProgress" style="width:${pct(b)}%"></i></div>
            <div class="page-keypad">${['1','2','3','4','5','6','7','8','9','Limpar','0','⌫'].map(k=>`<button type="button" data-digit="${k}" aria-label="${k==='⌫'?'Apagar último dígito':k}">${k}</button>`).join('')}</div>
            <div class="sheetbtns"><button type="button" class="pill" data-act="close">Cancelar</button><button type="button" class="pill primary" id="pageConfirm">Confirmar leitura</button></div>`);
            const value=$('#pageValue'),hint=$('#pageHint'),progress=$('#pageProgress');
            function paint(){const n=Number(digits)||0;value.textContent=digits||'0';hint.textContent=mode==='current'?'Em qual página você está?':'Quantas páginas você leu?';progress.style.width=b.pages?Math.min(100,Math.round((mode==='current'?n:(b.read||0)+n)/b.pages*100))+'%':'0%';}
            $('#panel .page-modes').onclick=e=>{const t=e.target.closest('[data-mode]');if(!t)return;mode=t.dataset.mode;digits=mode==='current'?String(b.read||0):'0';[...t.parentNode.children].forEach(x=>x.classList.toggle('on',x===t));paint()};
            $('#panel .page-keypad').onclick=e=>{const t=e.target.closest('[data-digit]');if(!t)return;const k=t.dataset.digit;if(k==='Limpar')digits='0';else if(k==='⌫')digits=digits.slice(0,-1)||'0';else digits=(digits==='0'?k:digits+k).slice(0,7);paint()};
            $('#pageConfirm').onclick=()=>{const n=Number(digits)||0,old=b.read||0;
                if(mode==='current'&&n<old){toast('A página atual não pode ser menor que a registrada.');return}
                if(b.pages&&((mode==='current'?n:old+n)>b.pages)){toast('A leitura não pode ultrapassar o total de '+b.pages+' páginas.');return}
                const amount=mode==='current'?n-old:n;
                if(amount<=0){toast('Informe uma quantidade maior que zero.');return}
                logPages(id,amount);if(b.status==='quero')b.status='lendo';save('📖 Leitura registrada!');closeSheet();render(true);
            };
        }
        function logSheet(preId) {
            const opts = S.books.filter(b => ['lendo', 'quero'].includes(b.status) || b.rereading);
            if (!opts.length) { toast('Adicione um livro e marque como "Lendo" para registrar sua leitura.'); return }
            openSheet(`<form id="lf"><h2>Registrar leitura</h2>
<label class="f">Livro</label><select class="in" name="b">${opts.map(b => `<option value="${b.id}" ${b.id === preId ? 'selected' : ''}>${esc(b.title)}</option>`).join('')}</select>

        function retroSheet() {
            const y = new Date().getFullYear(), ys = String(y);
            const done = S.books.filter(b => ['lido', 'releitura'].includes(b.status) && (b.date || '').startsWith(ys));
            const pages = done.reduce((t, b) => t + (+b.pages || 0), 0);
            const rated = done.filter(b => b.rating);
            const avg = rated.length ? (rated.reduce((t, b) => t + +b.rating, 0) / rated.length).toFixed(1) : '–';
            const best = [...rated].sort((a, b) => b.rating - a.rating)[0];
            const long = [...done].sort((a, b) => (b.pages || 0) - (a.pages || 0))[0];
            const months = Array(12).fill(0); done.forEach(b => { months[+b.date.slice(5, 7) - 1]++ });
            const mx = Math.max(1, ...months), MN = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'], top = months.indexOf(Math.max(...months));
            const yl = S.log.filter(l => l.d.startsWith(ys)), logged = yl.reduce((t, l) => t + l.p, 0), days = new Set(yl.map(l => l.d)).size, st = streakInfo();
            const slide = (e, big, small) => `<div class="slide"><div class="eyebrow">${e}</div><div class="bigno">${big}</div><div>${small}</div></div>`;
            openSheet(`<div class="row between"><h2>Retrospectiva ${y}</h2><button class="iconbtn" data-act="close" aria-label="Fechar">${ic('close')}</button></div>
<p class="muted" style="margin:6px 0 12px">Deslize para o lado.</p>
<div class="slides">${slide('Livros lidos', done.length, 'em ' + y)}${slide('Páginas', pages, logged ? 'e ' + logged + ' registradas em ' + days + ' dia' + (days === 1 ? '' : 's') : 'dos livros lidos')}${slide('Nota média', avg, rated.length ? rated.length + ' livro' + (rated.length === 1 ? '' : 's') + ' avaliado' + (rated.length === 1 ? '' : 's') : 'avalie seus livros')}${slide('Melhor sequência', st.best, 'dia' + (st.best === 1 ? '' : 's') + ' seguidos lendo')}${best ? slide('Favorito do ano', esc(best.title), Number(best.rating).toFixed(1) + ' estrelas · ' + esc(best.author)) : ''}${long && long.pages ? slide('Maior livro', long.pages + ' págs', esc(long.title)) : ''}</div>
<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:10px">Livros por mês</div><div class="week">${months.map((n, i) => `<div><i style="height:${Math.round(n / mx * 64) + 4}px;opacity:${n ? 1 : .25}"></i><small>${MN[i]}</small></div>`).join('')}</div>${done.length ? `<div class="muted" style="margin-top:8px">Mês mais lido: ${MN[top]}</div>` : ''}</div>`);
        }

            sharedClubSend: async id => {const content=$('#clubMessage')?.value.trim();if(!content)return;try{const r=await apiFetch('/api/community/clubs/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});if(!r.ok)throw Error('Falha ao enviar mensagem');await actions.sharedClubOpen(id)}catch(e){toast(e.message)}},
            postShareApply: () => {communityState.shareStyle=$('#shareStyle').value;communityState.shareMood=$('#shareMood').value;communityState.sharePct=Math.max(0,Math.min(100,Number($('#sharePct').value)||0));communityState.shareBg=$('#shareBg').value;communityState.shareColor=$('#shareColor').value;postShareSheet()},

            postType: type => {communityState.type=type;communityState.book=null;communityState.results=[];communityState.spoiler=false;render(true)},
            postPickLibrary: id => {const x=S.books.find(b=>String(b.id)===String(id));if(x){communityState.book={title:x.title,author:x.author,cover:x.cover||'',pages:x.pages||0,read:x.read||0};communityState.results=[];render(true)}},
            postClearBook: () => {communityState.book=null;communityState.results=[];render(true)},
            postCatalogSearch: async () => {const q=$('#postCatalogQuery')?.value.trim();if(!q)return toast('Digite um título, autor ou ISBN.');communityState.searching=true;communityState.results=[];render(true);try{const r=await fetch('/api/catalog/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error||'Falha na pesquisa');communityState.results=(data.books||[]).slice(0,12);if(!communityState.results.length)toast('Nenhum livro encontrado.')}catch(e){toast(e.message)}finally{communityState.searching=false;render(true)}},
            postPickCatalog: id => {const x=communityState.results[+id];if(x){communityState.book={title:x.title,author:x.author,cover:x.cover||'',pages:x.pages||0,read:0};communityState.results=[];render(true)}},
            revealSpoiler: (id,t) => {const p=t.nextElementSibling;p.hidden=!p.hidden;t.textContent=p.hidden?'⚠️ Contém spoilers · revelar texto':'Ocultar spoiler'},
            communityPost: async () => {
                const content=$('#communityText')?.value.trim();if(!content)return toast('Escreva uma mensagem.');
                const type=communityState.type, book=communityState.book;
                if(type!=='livre'&&!book)return toast('Escolha o livro desta publicação.');
                const payload={content,post_type:type,spoiler:!!$('#postSpoiler')?.checked,rating:Number($('#postRating')?.value||0),book:book||null};
                try {const r=await apiFetch('/api/community/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error((await r.json()).error||'Falha ao publicar');communityState.type='livre';communityState.book=null;communityState.results=[];communityState.spoiler=false;toast('Publicado com sucesso!');await refreshCommunity()}catch(e){toast(e.message)}
            },
            postShare: id => {const p=communityState.posts.find(x=>x.id===id);if(!p)return;communityState.sharePost=p;communityState.shareFormat='transparent';communityState.shareTransparent=true;postShareSheet()},
            postShareFormat: id => {communityState.shareFormat=id;postShareSheet()},
            postShareDownload: async () => {try{const cv=$('#postShareCanvas');if(!cv)return;const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw Error('Não foi possível gerar a imagem.');const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='amber-pages-'+communityState.shareFormat+'-'+Date.now()+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){toast(e.message)}},
            postShareNative: async () => {try{const cv=$('#postShareCanvas');const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw Error('Falha ao gerar imagem');const file=new File([blob],'amber-pages.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Amber Pages'})}else{actions.postShareDownload();toast('Imagem pronta para publicar na sua rede social.')}}catch(e){if(e.name!=='AbortError')toast(e.message)}},
            postShareCopy: () => {const p=communityState.sharePost;if(p)navigator.clipboard?.writeText((p.book_title?p.book_title+' — '+(p.book_author||'')+'\n':'')+p.content).then(()=>toast('Texto copiado!')).catch(()=>toast('Não foi possível copiar.'))},
            communityFollow: async id => {
                const u=communityState.people.find(p=>p.id===id);if(!u)return;
                try{const r=await apiFetch('/api/community/follow/'+encodeURIComponent(id),{method:u.following?'DELETE':'POST'});if(!r.ok)throw Error('Não foi possível atualizar');await refreshCommunity()}catch(e){toast(e.message)}
            },
            communityDelete: async id => {
                if(!confirm('Excluir esta publicação?'))return;
                try{const r=await apiFetch('/api/community/posts/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)throw Error('Não foi possível excluir');await refreshCommunity()}catch(e){toast(e.message)}
            },
            logout: async () => { const token=localStorage.getItem(TOKEN_KEY); if(token) await apiFetch('/api/auth/logout',{method:'POST'}).catch(()=>{}); localStorage.removeItem(TOKEN_KEY); authUser=null; initialized=false; location.reload(); },
            tab: id => { S.ui.tab = id; S.ui.q = ''; render(); window.scrollTo(0, 0); if(id==='comunidade')refreshCommunity() },
            close: closeSheet,
            filter: id => { S.ui.filter = id; render(true) },
            view: id => { S.ui.view = id; render(true) },
            addBook: id => bookSheet(null, id && STATUS.some(s => s[0] === id) ? id : 'quero'),
            openBook: id => bookSheet(id),
            addSuggest: i => { const [t, a] = SUGGEST[+i]; S.books.unshift({ id: uid(), title: t, author: a, pages: 0, read: 0, status: 'quero', rating: 0, date: '', color: +i % COVERS.length, colecao: '', note: '', cover: '' }); save(); render(true) },
            delBook: id => { if (confirm('Remover este livro da biblioteca?')) { S.books = S.books.filter(b => b.id !== id); if (S.user.featured === id) S.user.featured = ''; save(); closeSheet(); render(true) } },
            addPages: id => pageSheet(id),
            pageSheet: id => pageSheet(id),
            finish: id => { const b = byId(id); if (b.pages && (b.read || 0) < b.pages) logPages(id, b.pages - (b.read || 0)); if (b.rereading) { b.rereading = false; b.status = 'releitura' } else b.status = 'lido'; b.date = today(); if (b.pages) b.read = b.pages; S.ui.filter = b.status; save(); render(true); setTimeout(() => bookSheet(id), 80) },
            editPhrase: () => formSheet('Frase em destaque', [{ k: 'p', l: 'Sua frase', v: S.user.phrase, req: 1 }], d => { S.user.phrase = d.p.trim(); save(); render(true) }),
            editGoal: () => formSheet('Meta de leitura do ano', [{ k: 'g', l: 'Quantos livros?', t: 'number', v: S.user.goal, req: 1 }], d => { S.user.goal = Math.max(1, +d.g || 12); save(); render(true) }),
            editName: () => formSheet('Seu nome', [{ k: 'n', l: 'Nome', v: S.user.name, req: 1 }], d => { S.user.name = d.n.trim(); save(); render(true) }),
            editHint: () => toast('Toque em um livro para editar nota, páginas, coleção e capa.'),
            pickFeatured: () => {
                openSheet(`<h2>Livro em destaque</h2><div class="list" style="margin-top:14px">${S.books.map(b => `<button class="item" data-act="setFeatured" data-id="${b.id}">${coverHTML(b)}<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div></div></button>`).join('') || '<div class="empty">Adicione livros primeiro.</div>'}</div>`)
            },
            setFeatured: id => { S.user.featured = id; save(); closeSheet(); render(true) },
            collections: () => {
                const cols = [...new Set(S.books.map(b => b.colecao).filter(Boolean))];
                openSheet(`<h2>Estantes e coleções</h2><div class="list" style="margin-top:14px"><button class="item" data-act="setCol" data-id=""><div class="grow"><b>Todas</b><div class="muted">${S.books.length} livros</div></div>${S.ui.col === '' ? ic('check') : ''}</button>
${cols.map(c => `<button class="item" data-act="setCol" data-id="${esc(c)}"><div class="grow"><b>${esc(c)}</b><div class="muted">${S.books.filter(b => b.colecao === c).length} livros</div></div>${S.ui.col === c ? ic('check') : ''}</button>`).join('')}</div>
${cols.length ? '' : '<p class="muted" style="margin-top:12px">Crie coleções preenchendo o campo “Coleção” ao editar um livro.</p>'}`)
            },
            setCol: id => { S.ui.col = id; closeSheet(); render(true) },
            authorSearch: (id,t) => searchCatalog(t.dataset.q || ''),
            recentSearch: (id,t) => searchCatalog(t.dataset.q || ''),
            clearSearches: () => {localStorage.removeItem(recentKey());render(true)},
            share: id => shareSheet(id),
            fmt: (id, t) => { SH.fmt = id;[...t.parentNode.children].forEach(c => c.classList.toggle('on', c === t)); drawShare($('#cv')) },
            shareDetail: (id,t) => { SH.detail=id; [...t.parentNode.children].forEach(c=>c.classList.toggle('primary',c===t)); [...t.parentNode.children].forEach(c=>c.classList.toggle('soft',c!==t)); drawShare($('#cv')) },
            shareDeco: () => { SH.deco=!SH.deco; $('#decoState').textContent=SH.deco?'ativada':'desativada';drawShare($('#cv')) },
            pal: (id, t) => { SH.pal = +id;[...$('#pals').children].forEach(c => c.classList.toggle('on', c === t)); $('#palName').textContent = PALETTES[SH.pal].n; drawShare($('#cv')) },
            saveImg: async () => { const bl = await canvasBlob(); const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'amber-pages-' + SH.fmt + '.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000) },
            shareNow: async () => {
                const bl = await canvasBlob(); const file = new File([bl], 'amber-pages.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Amber Pages' }) } catch (e) { } }
                else actions.saveImg();
            },
            theme: id => { S.user.theme = id; save(); render(true) },
            calm: () => { S.user.calm = !S.user.calm; save(); render(true) },
            avatar: () => $('#fileAvatar').click(),
            addClub: () => formSheet('Novo clube do livro', [{ k: 'n', l: 'Nome do clube', req: 1 }, { k: 'b', l: 'Livro do mês (opcional)' }, { k: 'g', l: 'Meta de páginas (opcional)', t: 'number' }, { k: 'e', l: 'Prazo (opcional)', t: 'date' }], d => { S.clubs.unshift({ id: uid(), name: d.n.trim(), book: d.b.trim(), goal: +d.g || 0, end: d.e || '', members: [{ name: 'Você', pages: 0 }] }); save(); render(true) }, 'Criar'),
            delClub: id => { if (confirm('Excluir este clube?')) { S.clubs = S.clubs.filter(c => c.id !== id); save(); render(true) } },
            addMember: id => formSheet('Convidar membro', [{ k: 'n', l: 'Nome', req: 1 }], d => { const c = S.clubs.find(c => c.id === id); if (!c.members.some(m => m.name === d.n.trim())) c.members.push({ name: d.n.trim(), pages: 0 }); save(); render(true) }, 'Adicionar'),
            memberPages: (id, t) => { const c = S.clubs.find(c => c.id === id); const name = t.dataset.m; formSheet('Registrar páginas de ' + name, [{ k: 'p', l: 'Páginas lidas', t: 'number', v: 10, req: 1 }], d => { const m = c.members.find(m => m.name === name); if (m) { m.pages += Math.max(0, +d.p || 0); save(); render(true) } }, 'Registrar') },
            toggleTheme: () => { const m = { ambar: 'luna', luna: 'ambar', indigo: 'noite', noite: 'indigo' }; S.user.theme = m[S.user.theme] || 'ambar'; save(); render(true) },
            logRead: id => logSheet(id),
            reread: id => { const b = byId(id); b.rereads = (b.rereads || 0) + 1; b.status = 'releitura'; b.rereading = true; b.read = 0; S.ui.filter = 'releitura'; save(); closeSheet(); render(true) },
            retro: () => retroSheet(),
            restore: () => $('#fileRestore').click(),
            addCatalog: i => { const r = S.ui.cat.res[+i]; if (r) addFromCatalog(r, 'quero') },
            editCatalog: i => { const r = S.ui.cat.res[+i]; if (r) bookSheet(null, 'quero', { title: r.title, author: r.author, pages: r.pages, synopsis: r.synopsis, cover: r.cover }) },
            addManual: () => bookSheet(null, 'quero', { title: S.ui.cat.q || '' }),
            importar: () => importSheet(),
            rateList: id => rateSheet(String(id).split(',')),
            rateStar: (id, t) => { const b = byId(id); if (b) { b.rating = +t.dataset.n; save() } t.closest('.card').remove(); if (!$('#panel [data-rate]')) closeSheet(); render(true) },
            skipRate: (id, t) => { t.closest('.card').remove(); if (!$('#panel [data-rate]')) closeSheet() },
            tplCsv: () => { const csv = 'Título,Autor,Páginas,Nota,Estante,Data,Resenha\n"Dom Casmurro","Machado de Assis",256,4.5,lido,2026-05-11,"Um clássico."\n"Iracema","José de Alencar",160,,quero,,\n'; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'modelo-amber-pages.csv'; a.click() },
            export: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ user: S.user, books: S.books, clubs: S.clubs, log: S.log }, null, 1)], { type: 'application/json' })); a.download = 'amber-pages-backup.json'; a.click() },
            reset: () => { if (confirm('Apagar todos os seus livros, clubes e configurações neste aparelho?')) { localStorage.removeItem(stateKey()); load(); save(); render(); window.scrollTo(0, 0) } }
        };
        document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = actions[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset.id, t) } });
        document.addEventListener('change',e=>{if(e.target.id==='postType')actions.postType(e.target.value);if(e.target.id==='postLibrary'&&e.target.value)actions.postPickLibrary(e.target.value)});
        document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='postCatalogQuery'){e.preventDefault();actions.postCatalogSearch()}});
        $('#fileAvatar').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; S.user.avatar = await resizeImg(f, 256, .85); save(); render(true); e.target.value = '' });

        $('#fileRestore').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!j || !Array.isArray(j.books)) throw 0; if (!confirm('Substituir os dados deste aparelho pela cópia?')) { e.target.value = ''; return } S.user = Object.assign(S.user, j.user || {}); S.books = j.books; S.clubs = Array.isArray(j.clubs) ? j.clubs : []; S.log = Array.isArray(j.log) ? j.log : []; save(); render(); toast('Cópia restaurada.') } catch (err) { toast('Arquivo de cópia inválido.') } e.target.value = '' });
        async function startAuthenticated() {
            const token=localStorage.getItem(TOKEN_KEY);
            if(token) {
                try {const r=await apiFetch('/api/auth/me'); if(r.ok){authUser=(await r.json()).user; $('#authGate').hidden=true; await initApp(); return;}}
                catch(e) {console.error(e);}
                localStorage.removeItem(TOKEN_KEY);
            }
            showAuth();
        }
        function showAuth() {
            $('#authGate').hidden=false;
            $('#authGate').innerHTML=`<div class="auth-card"><h1>Amber Pages</h1><p>Entre na sua jornada literária.</p>
              <div class="chips" style="justify-content:center;margin-bottom:16px"><button class="pill primary" type="button" id="authLogin">Entrar</button><button class="pill" type="button" id="authRegister">Criar conta</button></div>
              <form id="authForm"><div id="authNameWrap" hidden><label class="f">Nome</label><input class="in" name="name" autocomplete="name"></div>
              <label class="f">E-mail</label><input class="in" name="email" type="email" autocomplete="email" required>
              <label class="f">Senha</label><input class="in" name="password" type="password" autocomplete="current-password" required minlength="10">
              <p id="authError" role="alert" class="muted"></p><button class="pill primary" style="width:100%;justify-content:center;margin-top:12px" id="authSubmit">Entrar</button></form></div>`;
            let mode='login';
            const setMode=m=>{mode=m;$('#authNameWrap').hidden=m!=='register';$('#authSubmit').textContent=m==='register'?'Criar conta':'Entrar';$('#authError').textContent='';};
            $('#authLogin').onclick=()=>setMode('login'); $('#authRegister').onclick=()=>setMode('register');
            $('#authForm').onsubmit=async e=>{
                e.preventDefault(); const form=e.currentTarget; const data=Object.fromEntries(new FormData(form));
                $('#authSubmit').disabled=true; $('#authError').textContent='';
                try {const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
                    const result=await r.json(); if(!r.ok) throw Error(result.error||'Falha ao autenticar.');
                    localStorage.setItem(TOKEN_KEY,result.token);authUser=result.user;$('#authGate').hidden=true;initialized=false;syncPending=false;
                    await initApp();
                } catch(err){$('#authError').textContent=err.message;}
                finally{$('#authSubmit').disabled=false;}
            };
        }
        startAuthenticated();
        if ('serviceWorker' in navigator) { }
    </script>
</body>

</html>
